name: ci
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONHASHSEED: "0"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff pytest
      - name: 任意の画像解析依存関係（外部API不要）
        run: pip install '.[vision]'
      - name: 静的検査
        run: ruff check .
      - name: 基本テスト
        run: python -m pytest
      - name: 外部予測台帳の改竄検査
        run: python -m babel external verify
