name: external
# 初見コーパスが external/inbox に追加されたら予測を保存し、正解が external/answers に追加されたら採点する。
on:
  push:
    paths: ["external/inbox/**", "external/answers/**"]
  workflow_dispatch:
permissions:
  contents: write
# 同じブランチでの実行を直列化する。並行すると、正解を見た予測が「最初の試行」として残りうる
concurrency:
  group: external-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONHASHSEED: "0"
jobs:
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}    # push されたコミットではなく、実行開始時点のブランチ先頭（直前の実行の予測を含む）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 予測（既存の予測は上書きしない）
        run: python -m babel external predict
      - name: 採点（正解が追加されたものだけ）
        run: python -m babel external score
      - name: 結果をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add external
          git diff --cached --quiet || git commit -m "外部コーパスの予測・採点結果を記録 [skip ci]"
          git push
